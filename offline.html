<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Joke Club - Offline</title>
  <meta name="theme-color" content="#2563eb" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f7fb;
      --bg-soft: #edf1f7;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #5f6b7a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-strong: #e8f0ff;
      --border: #d8dee8;
      --shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    body {
      display: grid;
      place-items: center;
      padding: 1.4rem;
    }
    .card {
      width: min(680px, 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: var(--accent-strong);
      margin-bottom: 0.8rem;
      font-size: 1.25rem;
    }
    h1 {
      margin: 0 0 0.6rem;
      font-size: 1.4rem;
    }
    p {
      margin: 0.4rem 0;
      color: var(--muted);
      line-height: 1.5;
    }
    .actions {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
    }
    button, a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.6rem 1.1rem;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover, a:hover {
      background: var(--accent-hover);
    }
    .ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }
    .ghost:hover {
      background: var(--bg-soft);
    }
  </style>
</head>
<body>
  <section class="card" aria-labelledby="offline-title">
    <div class="badge" aria-hidden="true">📴</div>
    <h1 id="offline-title">You are offline</h1>
    <p>Your app shell is cached, but this page needs a connection for fresh content.</p>
    <p>Reopen the app to read cached jokes and saved data once the network is back.</p>
    <div class="actions">
      <button type="button" onclick="window.location.reload()">Try again</button>
      <a href="/#/jokes" class="ghost">Open app home</a>
    </div>
  </section>
</body>
</html>
