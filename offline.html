<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Joke Club - Offline</title>
  <meta name="theme-color" content="#ffeaa7" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f7f7f7;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #5c5c5c;
      --accent-strong: #f6e58d;
      --border: #222;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Comic Neue", "Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive, sans-serif;
      color: var(--text);
      background: var(--bg-soft);
    }
    body {
      display: grid;
      place-items: center;
      padding: 1.2rem;
    }
    .card {
      width: min(680px, 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 1.4rem;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--accent-strong);
      margin-bottom: 0.8rem;
      font-size: 1.25rem;
    }
    h1 {
      margin: 0 0 0.6rem;
      font-size: 1.4rem;
    }
    p {
      margin: 0.4rem 0;
      color: var(--muted);
      line-height: 1.5;
    }
    .actions {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
    }
    button, a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.6rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--accent-strong);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }
    .ghost {
      background: transparent;
    }
  </style>
</head>
<body>
  <section class="card" aria-labelledby="offline-title">
    <div class="badge" aria-hidden="true">📴</div>
    <h1 id="offline-title">You are offline</h1>
    <p>Your app shell is cached, but this page needs a connection for fresh content.</p>
    <p>Reopen the app to read cached jokes and saved data once the network is back.</p>
    <div class="actions">
      <button type="button" onclick="window.location.reload()">Try again</button>
      <a href="/#/jokes" class="ghost">Open app home</a>
    </div>
  </section>
</body>
</html>
