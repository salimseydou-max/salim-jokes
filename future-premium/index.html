<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Future Premium | Voice Joke Club</title>
  <meta
    name="description"
    content="Voice Joke Club premium experience is currently under development."
  />
  <meta name="theme-color" content="#0f172a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  />
  <style>
    :root {
      --bg: #0f172a;
      --surface: #111f3a;
      --text: #f8fafc;
      --muted: #c3cfdf;
      --border: rgba(195, 207, 223, 0.22);
      --accent: #38bdf8;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #1d3358 0%, #0f172a 55%, #090f1d 100%);
      color: var(--text);
    }
    body {
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .card {
      width: min(720px, 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(17, 31, 58, 0.95);
      padding: 1.2rem;
    }
    h1 {
      margin: 0;
      font-size: 1.3rem;
    }
    p {
      margin: 0.8rem 0 0;
      color: var(--muted);
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1rem;
      min-height: 44px;
      padding: 0.55rem 1rem;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(56, 189, 248, 0.2);
      color: #eaf8ff;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      border-color: rgba(56, 189, 248, 0.66);
      background: rgba(56, 189, 248, 0.28);
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="future-premium-title">
    <h1 id="future-premium-title">Premium features are under development</h1>
    <p>
      We are currently building premium capabilities with a focus on performance, stability, and a
      polished experience.
    </p>
    <p>
      While this work continues, you can keep enjoying free jokes and the full scrolling feed in the
      app.
    </p>
    <a href="/#/feed">Continue to free jokes</a>
  </main>
</body>
</html>
